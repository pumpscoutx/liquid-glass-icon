<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Liquid Glass Icon / three.js demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Background concentric rings */
    .bg-rings {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      width: 140vmin;
      height: 140vmin;
    }
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.035);
      pointer-events: none;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
    }
    .ring-1 { width: 32vmin; height: 32vmin; border-color: rgba(0,0,0,0.05); }
    .ring-2 { width: 55vmin; height: 55vmin; }
    .ring-3 { width: 82vmin; height: 82vmin; }
    .ring-4 { width: 115vmin; height: 115vmin; }

    /* Top Left Header */
    .header {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .header-sub {
      font-size: 11px;
      font-weight: 500;
      color: #888888;
      letter-spacing: -0.01em;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-author {
      font-size: 10px;
      font-weight: 500;
      color: #a0a0a0;
    }

    /* Hint text above toolbar */
    .hint-text {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      font-weight: 500;
      color: #777777;
      letter-spacing: -0.01em;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* Floating bottom pill dock */
    .dock-wrapper {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .dock {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 8px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
    }
    .swatches {
      display: flex;
      gap: 6px;
      padding: 0 2px;
    }
    .swatch-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: none;
      outline: none;
      cursor: pointer;
      position: relative;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      transition: transform 0.15s cubic-bezier(0.2, 0, 0.1, 1), box-shadow 0.15s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swatch-btn:hover {
      transform: scale(1.08);
    }
    .swatch-btn.active {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25), 0 0 0 2px #1e1e1e;
      transform: scale(1.05);
    }
    .swatch-violet {
      background: linear-gradient(135deg, #b86bff, #8027e8);
    }
    .swatch-magenta {
      background: linear-gradient(135deg, #ff4d9d, #e01a88);
    }
    .swatch-crimson {
      background: linear-gradient(135deg, #ff2d7a, #d60b38);
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(0, 0, 0, 0.1);
      margin: 0 2px;
    }
    .pill-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #1e1e1e;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .pill-btn:hover {
      transform: scale(1.06);
      background: #333333;
    }
    .pill-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Fake cursor circle for scripted replay */
    #fake-cursor {
      position: absolute;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px solid rgba(0, 0, 0, 0.35);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      transition: width 0.12s ease, height 0.12s ease, background 0.12s ease;
      display: none;
    }
    #fake-cursor.down {
      width: 17px;
      height: 17px;
      background: rgba(220, 220, 220, 0.85);
      border-color: rgba(0, 0, 0, 0.6);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="bg-rings">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ring ring-4"></div>
  </div>

  <div id="canvas-container"></div>

  <div class="header">
    <div class="header-sub">Interactive 3D WebGL</div>
    <div class="header-title">Liquid Glass Icon / three.js demo</div>
    <div class="header-author">Dynamic Fluid &amp; Glass Simulation</div>
  </div>

  <div class="hint-text">Drag the glass to spin it · Tap it to slosh the liquid</div>

  <div class="dock-wrapper">
    <div class="dock">
      <div class="swatches">
        <button class="swatch-btn swatch-violet" data-theme="violet" title="Lavender Violet"></button>
        <button class="swatch-btn swatch-magenta" data-theme="magenta" title="Hot Magenta"></button>
        <button class="swatch-btn swatch-crimson active" data-theme="crimson" title="Hot Pink / Crimson"></button>
      </div>
      <div class="divider"></div>
      <button class="pill-btn" id="btn-sound" title="Toggle Sound">
        <svg viewBox="0 0 24 24">
          <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5 9.77L7.83 9H4v6h3.83l3.67 4V5l-3.67 4z"/>
        </svg>
      </button>
      <button class="pill-btn" id="btn-play" title="Pause / Play Tour">
        <svg viewBox="0 0 24 24" id="play-pause-icon">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="fake-cursor"></div>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // THEMES (Hot Pink default at t=0, with deeper saturated bottoms)
    const THEMES = {
      crimson: {
        id: 'crimson',
        coreHex: '#ff1f6d',
        topHex: '#ffcce3',
        bottomHex: '#450018',
        highlightHex: '#ffffff',
        index: 2
      },
      magenta: {
        id: 'magenta',
        coreHex: '#d60072',
        topHex: '#ffb5e3',
        bottomHex: '#38001d',
        highlightHex: '#ffffff',
        index: 1
      },
      violet: {
        id: 'violet',
        coreHex: '#8b24e4',
        topHex: '#ebd1ff',
        bottomHex: '#26004d',
        highlightHex: '#ffffff',
        index: 0
      }
    };

    let currentThemeKey = 'crimson';
    let currentTheme = THEMES[currentThemeKey];

    // Query params
    const urlParams = new URLSearchParams(window.location.search);
    const isRenderMode = urlParams.has('render');

    // Scene & Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    // Base camera z distance scaled so icon fills ~45% viewport height in 1480x1080
    const BASE_CAMERA_Z = 6.8;
    camera.position.set(0, 0, BASE_CAMERA_Z);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xe6e6e6, 1.0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    // Environment map
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new RoomEnvironment();
    const envTexture = pmremGenerator.fromScene(roomEnv, 0.04).texture;
    scene.environment = envTexture;

    // Lights - Boosted directional rim and key lights for crisp glass bevel highlights
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 3.2);
    dirLight1.position.set(5, 7, 6);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xcce6ff, 2.0);
    dirLight2.position.set(-6, 4, 5);
    scene.add(dirLight2);

    const backLight = new THREE.DirectionalLight(0xffffff, 2.5);
    backLight.position.set(-2, -4, -5);
    scene.add(backLight);

    // Root Icon Pivot
    const iconRoot = new THREE.Group();
    scene.add(iconRoot);

    // Helper: Squircle Path
    function createSquircleShape(size, radius) {
      const shape = new THREE.Shape();
      const x = -size / 2;
      const y = -size / 2;
      const w = size;
      const h = size;
      const r = radius;

      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h - r);
      shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      shape.lineTo(x + r, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    // 1. CLEAR GLASS SLAB with thicker, clearer bevel & crisp bright white edge highlight
    const glassWidth = 2.0;
    const glassRadius = 0.50;
    const glassExtrudeDepth = 0.28;
    const glassBevel = 0.09; // Thicker bevel! Total thickness = 0.28 + 2*0.09 = 0.46
    const outerShape = createSquircleShape(glassWidth, glassRadius);

    const glassExtrudeSettings = {
      depth: glassExtrudeDepth,
      bevelEnabled: true,
      bevelSegments: 10,
      steps: 1,
      bevelSize: glassBevel,
      bevelThickness: glassBevel
    };

    const glassGeometry = new THREE.ExtrudeGeometry(outerShape, glassExtrudeSettings);
    glassGeometry.center();

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.25,
      roughness: 0.03,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      reflectivity: 0.98,
      ior: 1.52,
      specularIntensity: 1.5,
      specularColor: new THREE.Color(0xffffff),
      iridescence: 0.5,
      iridescenceIOR: 1.3,
      iridescenceThicknessRange: [100, 400],
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const glassMesh = new THREE.Mesh(glassGeometry, glassMaterial);
    glassMesh.renderOrder = 10;
    iconRoot.add(glassMesh);

    // Crisp bright white rim highlight on glass bevel edges
    const glassEdgesGeom = new THREE.EdgesGeometry(glassGeometry, 20);
    const glassEdgeMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.75,
      linewidth: 1.5
    });
    const glassEdges = new THREE.LineSegments(glassEdgesGeom, glassEdgeMat);
    glassMesh.add(glassEdges);

    // 2. LIQUID MESH (~55% height fill, glossy top highlight band, deep saturated bottom)
    const innerW = 1.68;
    const fillH = 0.924; // Exactly ~55% of inner cavity height (1.68)
    const innerD = 0.38;
    const cornerR = 0.35;

    const liquidGeom = new THREE.BoxGeometry(innerW, fillH, innerD, 40, 24, 20);
    // Center liquid at Y = -0.378 to fill bottom 55% of cavity
    liquidGeom.translate(0, -0.378, 0);

    const posAttr = liquidGeom.attributes.position;
    const origPositions = new Float32Array(posAttr.array.length);
    origPositions.set(posAttr.array);

    const colors = new Float32Array(posAttr.count * 3);
    liquidGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Deform side vertices to match inner squircle radius
    const hx = innerW * 0.5;
    const hy = 0.84; // cavity half height
    for (let i = 0; i < posAttr.count; i++) {
      let x = posAttr.getX(i);
      let y = posAttr.getY(i);

      const cx = Math.max(-(hx - cornerR), Math.min(hx - cornerR, x));
      const cy = Math.max(-(hy - cornerR), Math.min(hy - cornerR, y));
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      if (dist > cornerR) {
        x = cx + (dx / dist) * cornerR;
        y = cy + (dy / dist) * cornerR;
        posAttr.setXY(i, x, y);
      }
    }
    posAttr.needsUpdate = true;
    origPositions.set(posAttr.array);

    const liquidMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(currentTheme.coreHex),
      vertexColors: true,
      roughness: 0.05,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      transmission: 0.15,
      opacity: 0.96,
      transparent: true,
      emissive: new THREE.Color(currentTheme.coreHex),
      emissiveIntensity: 0.22,
      depthWrite: true
    });

    const liquidMesh = new THREE.Mesh(liquidGeom, liquidMaterial);
    liquidMesh.renderOrder = 1;
    iconRoot.add(liquidMesh);

    // 3. MUSIC NOTE (Solid glossy black IN FRONT of liquid, higher renderOrder, depthTest true, opaque)
    // Note spans ~65% of icon width (~1.30) and ~70% height (~1.40), centered slightly up
    function createOvalShape(cx, cy, rx, ry, angle) {
      const shape = new THREE.Shape();
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const segs = 32;
      for (let i = 0; i <= segs; i++) {
        const theta = (i / segs) * Math.PI * 2;
        const px = rx * Math.cos(theta);
        const py = ry * Math.sin(theta);
        const x = cx + px * cosA - py * sinA;
        const y = cy + px * sinA + py * cosA;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      return shape;
    }

    const noteGroup = new THREE.Group();
    const noteMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x050508,
      roughness: 0.10,
      metalness: 0.85,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      reflectivity: 0.95,
      opacity: 1.0,
      transparent: false,
      depthTest: true,
      depthWrite: true
    });

    const noteExtrudeSettings = {
      depth: 0.10,
      bevelEnabled: true,
      bevelThickness: 0.02,
      bevelSize: 0.02,
      bevelSegments: 4,
      steps: 1
    };

    const tiltAngle = -0.32;
    const head1Shape = createOvalShape(-0.36, -0.32, 0.20, 0.13, tiltAngle);
    const head2Shape = createOvalShape(0.28, -0.12, 0.20, 0.13, tiltAngle);

    const stemsBeamShape = new THREE.Shape();
    const sw = 0.07;
    stemsBeamShape.moveTo(-0.24 - sw, -0.30);
    stemsBeamShape.lineTo(-0.24, -0.30);
    stemsBeamShape.lineTo(-0.24, 0.48);
    stemsBeamShape.lineTo(0.42, 0.68);
    stemsBeamShape.lineTo(0.42, -0.10);
    stemsBeamShape.lineTo(0.42 + sw, -0.10);
    stemsBeamShape.lineTo(0.42 + sw, 0.86);
    stemsBeamShape.lineTo(-0.24 - sw, 0.66);
    stemsBeamShape.closePath();

    const gHead1 = new THREE.ExtrudeGeometry(head1Shape, noteExtrudeSettings);
    const gHead2 = new THREE.ExtrudeGeometry(head2Shape, noteExtrudeSettings);
    const gStems = new THREE.ExtrudeGeometry(stemsBeamShape, noteExtrudeSettings);

    const mHead1 = new THREE.Mesh(gHead1, noteMaterial);
    const mHead2 = new THREE.Mesh(gHead2, noteMaterial);
    const mStems = new THREE.Mesh(gStems, noteMaterial);

    noteGroup.add(mHead1);
    noteGroup.add(mHead2);
    noteGroup.add(mStems);

    // Scale note to span ~65% icon width and ~70% height, placed at front half of slab (Z = 0.08)
    noteGroup.scale.set(1.12, 1.12, 1.0);
    noteGroup.position.set(0.02, 0.06, 0.08);
    noteGroup.renderOrder = 5; // Rendered after liquid so it stays crisp black in front
    iconRoot.add(noteGroup);

    // Initial icon rotation
    iconRoot.rotation.set(-0.08, 0.15, -0.05);

    // SPRING-DAMPER SLOSH SIMULATION
    class SloshPhysics {
      constructor() {
        this.currentTilt = new THREE.Vector2(0, 0);
        this.tiltVelocity = new THREE.Vector2(0, 0);
        this.stiffness = 42.0;
        this.damping = 5.2;
        this.impulseWave = 0.0;
        this.waveTime = 0.0;
      }

      reset() {
        this.currentTilt.set(0, 0);
        this.tiltVelocity.set(0, 0);
        this.impulseWave = 0.0;
        this.waveTime = 0.0;
      }

      step(dt, iconRotMatrix, angVel) {
        this.waveTime += dt;

        const invRot = iconRotMatrix.clone().invert();
        const worldDown = new THREE.Vector3(0, -1, 0);
        const localDown = worldDown.applyMatrix4(invRot);
        const targetNormal = localDown.clone().negate().normalize();

        const targetTiltX = THREE.MathUtils.clamp(-targetNormal.x * 1.4 - angVel.y * 0.4, -0.85, 0.85);
        const targetTiltZ = THREE.MathUtils.clamp(-targetNormal.z * 1.4 + angVel.x * 0.4, -0.85, 0.85);

        const forceX = (targetTiltX - this.currentTilt.x) * this.stiffness - this.tiltVelocity.x * this.damping;
        const forceZ = (targetTiltZ - this.currentTilt.y) * this.stiffness - this.tiltVelocity.y * this.damping;

        this.tiltVelocity.x += forceX * dt;
        this.tiltVelocity.y += forceZ * dt;

        this.currentTilt.x += this.tiltVelocity.x * dt;
        this.currentTilt.y += this.tiltVelocity.y * dt;

        this.impulseWave = Math.max(0.0, this.impulseWave - dt * 1.6);
      }

      addImpulse(magnitude) {
        this.tiltVelocity.x += (Math.random() - 0.5) * magnitude * 8.0;
        this.tiltVelocity.y += (Math.random() - 0.5) * magnitude * 8.0;
        this.impulseWave = Math.min(0.12, this.impulseWave + magnitude * 0.15);
      }

      getNormal() {
        return new THREE.Vector3(this.currentTilt.x, 1.0, this.currentTilt.y).normalize();
      }
    }

    const sloshSim = new SloshPhysics();

    // Update liquid surface mesh deformation & vertex gradient colors
    function updateLiquidMesh() {
      const norm = sloshSim.getNormal();
      const tiltX = norm.x;
      const tiltZ = norm.z;
      const waveT = sloshSim.waveTime;
      const amp = 0.025 + sloshSim.impulseWave;

      const cCore = new THREE.Color(currentTheme.coreHex);
      const cTop = new THREE.Color(currentTheme.topHex);
      const cBot = new THREE.Color(currentTheme.bottomHex);
      const cHighlight = new THREE.Color(currentTheme.highlightHex);

      const positions = posAttr.array;
      const colAttr = liquidGeom.attributes.color;
      const colArray = colAttr.array;

      for (let i = 0; i < posAttr.count; i++) {
        const idx = i * 3;
        const x0 = origPositions[idx];
        const y0 = origPositions[idx + 1];
        const z0 = origPositions[idx + 2];

        // Slosh wave displacement on top surface vertices
        if (y0 > -0.1) {
          const wave = Math.sin(x0 * 6.0 + z0 * 4.0 + waveT * 5.0) * amp +
                     Math.cos(x0 * 3.5 - z0 * 5.0 + waveT * 4.0) * (amp * 0.65);
          const dy = -(tiltX * x0 + tiltZ * z0) * 0.82 + wave;
          positions[idx + 1] = y0 + dy;
        } else {
          positions[idx + 1] = y0;
        }

        // Vertical gradient: deep saturated bottom, rich core, crisp glossy white highlight band near top
        const normY = THREE.MathUtils.clamp((positions[idx + 1] - (-0.84)) / 0.924, 0.0, 1.0);
        let vColor = new THREE.Color();
        if (normY > 0.82) {
          // Strong glossy highlight band near liquid surface
          const t = (normY - 0.82) / 0.18;
          vColor.lerpColors(cTop, cHighlight, t * 0.85);
        } else {
          vColor.lerpColors(cBot, cCore, Math.pow(normY / 0.82, 0.75));
        }

        colArray[idx] = vColor.r;
        colArray[idx + 1] = vColor.g;
        colArray[idx + 2] = vColor.b;
      }

      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;

      liquidMaterial.color.copy(cCore);
      liquidMaterial.emissive.copy(cCore);
    }

    // Theme switching
    function setTheme(themeKey) {
      if (!THEMES[themeKey]) return;
      currentThemeKey = themeKey;
      currentTheme = THEMES[themeKey];

      document.querySelectorAll('.swatch-btn').forEach(btn => {
        if (btn.dataset.theme === themeKey) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      sloshSim.addImpulse(0.2);
    }

    // UI Swatches
    document.querySelectorAll('.swatch-btn').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        isUserInteracting = true;
        setTheme(btn.dataset.theme);
      });
    });

    const btnPlay = document.getElementById('btn-play');
    const playPauseIcon = document.getElementById('play-pause-icon');
    let tourPaused = false;

    btnPlay.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      tourPaused = !tourPaused;
      if (tourPaused) {
        playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      } else {
        playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        isUserInteracting = false;
      }
    });

    // Interaction handling
    let isUserInteracting = false;
    let isPointerDown = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let angularVel = new THREE.Vector2(0, 0);
    let lastFrameTime = performance.now();

    const iconEuler = new THREE.Euler(-0.08, 0.15, -0.05, 'YXZ');
    const iconQuaternion = new THREE.Quaternion().setFromEuler(iconEuler);

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.dock-wrapper') || e.target.closest('.header')) return;
      isPointerDown = true;
      isUserInteracting = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      angularVel.set(0, 0);
      sloshSim.addImpulse(0.25);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      const rotSpeed = 0.007;
      angularVel.x = dy * rotSpeed * 30.0;
      angularVel.y = dx * rotSpeed * 30.0;

      const deltaQuat = new THREE.Quaternion();
      deltaQuat.setFromEuler(new THREE.Euler(dy * rotSpeed, dx * rotSpeed, 0, 'XYZ'));
      iconQuaternion.premultiply(deltaQuat);
    });

    const endPointer = () => {
      if (isPointerDown) {
        isPointerDown = false;
        sloshSim.addImpulse(0.15);
      }
    };
    window.addEventListener('pointerup', endPointer);
    window.addEventListener('pointercancel', endPointer);

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      if (camera.aspect < 1.0) {
        camera.position.z = BASE_CAMERA_Z / (camera.aspect * 0.92);
      } else {
        camera.position.z = BASE_CAMERA_Z;
      }
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    onResize();

    // SCRIPTED TOUR (29.45s)
    const TOUR_DURATION = 29.45;

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function getTourStateAt(t) {
      const state = {
        rotX: -0.08,
        rotY: 0.15,
        rotZ: -0.05,
        zoom: BASE_CAMERA_Z,
        theme: 'crimson',
        cursorActive: false,
        cursorDown: false,
        cursorX: 0.5,
        cursorY: 0.5,
        impulse: 0.0
      };

      if (t < 2.0) {
        state.theme = 'crimson';
        state.rotX = -0.08 + Math.sin(t * 1.5) * 0.03;
        state.rotY = 0.15 + Math.cos(t * 1.2) * 0.04;
        const p = smoothstep(0.5, 1.8, t);
        state.cursorActive = t > 0.4;
        state.cursorX = lerp(0.68, 0.62, p);
        state.cursorY = lerp(0.55, 0.48, p);
        state.cursorDown = t >= 1.8;
      } else if (t < 5.0) {
        state.theme = 'crimson';
        state.cursorActive = true;
        state.cursorDown = true;
        const p = smoothstep(2.0, 5.0, t);
        state.cursorX = lerp(0.62, 0.38, p);
        state.cursorY = lerp(0.48, 0.32, p);
        state.rotX = lerp(-0.08, 0.42, p);
        state.rotY = lerp(0.15, -0.95, p);
        state.rotZ = lerp(-0.05, 0.28, p);
      } else if (t < 8.5) {
        state.theme = 'crimson';
        const p = smoothstep(5.0, 8.5, t);
        state.cursorActive = t < 7.0;
        state.cursorDown = t < 6.2;
        state.cursorX = lerp(0.38, 0.45, Math.min(1, (t - 5.0) / 1.5));
        state.cursorY = lerp(0.32, 0.42, Math.min(1, (t - 5.0) / 1.5));
        state.rotX = lerp(0.42, -0.15, p);
        state.rotY = lerp(-0.95, 0.25, p);
        state.rotZ = lerp(0.28, -0.08, p);
      } else if (t < 10.5) {
        state.theme = 'crimson';
        const p = smoothstep(8.5, 9.4, t);
        state.cursorActive = true;
        state.cursorX = lerp(0.45, 0.52, p);
        state.cursorY = lerp(0.42, 0.46, p);
        state.cursorDown = t >= 9.3 && t <= 9.7;
        if (t >= 9.35 && t <= 9.5) {
          state.impulse = 0.4;
          state.rotX = -0.15 + (t - 9.35) * 0.3;
        } else {
          state.rotX = -0.15;
        }
        state.rotY = 0.25;
        state.rotZ = -0.08;
      } else if (t < 12.0) {
        const p = smoothstep(10.5, 11.4, t);
        state.cursorActive = true;
        state.cursorX = lerp(0.52, 0.50, p);
        state.cursorY = lerp(0.46, 0.94, p);
        state.cursorDown = t >= 11.2 && t <= 11.6;
        state.theme = t >= 11.3 ? 'magenta' : 'crimson';
        state.rotX = -0.12;
        state.rotY = 0.22;
        state.rotZ = -0.06;
      } else if (t < 16.5) {
        state.theme = 'magenta';
        state.cursorActive = true;
        const p = smoothstep(12.0, 16.5, t);
        state.cursorDown = true;
        state.cursorX = 0.50 + Math.sin((t - 12.0) * 1.8) * 0.18;
        state.cursorY = 0.52 + Math.cos((t - 12.0) * 1.8) * 0.14;
        state.rotX = lerp(-0.12, 0.65, p) + Math.sin(t * 2.0) * 0.15;
        state.rotY = lerp(0.22, 1.85, p);
        state.rotZ = lerp(-0.06, -0.45, p);
      } else if (t < 20.5) {
        state.theme = 'magenta';
        const p = smoothstep(16.5, 19.0, t);
        state.cursorActive = t < 18.5;
        state.cursorDown = t < 17.8;
        state.cursorX = lerp(0.50, 0.55, p);
        state.cursorY = lerp(0.52, 0.50, p);
        state.rotX = lerp(0.65, 0.05, p);
        state.rotY = lerp(1.85, 1.57, p);
        state.rotZ = lerp(-0.45, 0.0, p);
        const zP = smoothstep(17.0, 19.0, t) * (1 - smoothstep(19.8, 20.5, t));
        state.zoom = lerp(BASE_CAMERA_Z, BASE_CAMERA_Z * 0.88, zP);
      } else if (t < 22.5) {
        const p = smoothstep(20.5, 21.5, t);
        state.cursorActive = true;
        state.cursorX = lerp(0.55, 0.47, p);
        state.cursorY = lerp(0.50, 0.94, p);
        state.cursorDown = t >= 21.3 && t <= 21.8;
        state.theme = t >= 21.4 ? 'violet' : 'magenta';
        state.rotX = 0.05;
        state.rotY = lerp(1.57, 0.8, smoothstep(20.5, 22.5, t));
        state.rotZ = 0.0;
      } else if (t <= TOUR_DURATION) {
        state.theme = 'violet';
        const p = (t - 22.5) / (TOUR_DURATION - 22.5);
        state.cursorActive = t < 26.5;
        state.cursorDown = t >= 22.8 && t <= 25.8;
        state.cursorX = 0.47 + Math.cos(t * 1.5) * 0.15;
        state.cursorY = 0.60 + Math.sin(t * 1.5) * 0.12;

        const easeOut = 1 - Math.pow(1 - p, 2.5);
        state.rotX = lerp(0.05, -0.08, easeOut) + Math.sin(t * 3.0) * (1 - easeOut) * 0.25;
        state.rotY = lerp(0.8, 0.15 + Math.PI * 2, easeOut);
        state.rotZ = lerp(0.0, -0.05, easeOut) + Math.cos(t * 2.5) * (1 - easeOut) * 0.18;
      }

      return state;
    }

    const ringEls = [
      document.querySelector('.ring-1'),
      document.querySelector('.ring-2'),
      document.querySelector('.ring-3'),
      document.querySelector('.ring-4')
    ];

    function updateRings(motionEnergy) {
      ringEls.forEach((el, i) => {
        if (!el) return;
        const scale = 1.0 + motionEnergy * (0.05 + i * 0.03);
        const opacity = Math.min(0.25, 0.04 + (4 - i) * 0.02 + motionEnergy * 0.08);
        el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        el.style.opacity = opacity;
      });
    }

    const fakeCursorEl = document.getElementById('fake-cursor');

    function applyState(state) {
      if (currentThemeKey !== state.theme) {
        setTheme(state.theme);
      }

      iconEuler.set(state.rotX, state.rotY, state.rotZ, 'YXZ');
      iconQuaternion.setFromEuler(iconEuler);
      iconRoot.quaternion.copy(iconQuaternion);

      if (camera.aspect < 1.0) {
        camera.position.z = state.zoom / (camera.aspect * 0.92);
      } else {
        camera.position.z = state.zoom;
      }
      camera.updateProjectionMatrix();

      if (state.cursorActive) {
        fakeCursorEl.style.display = 'block';
        fakeCursorEl.style.left = `${state.cursorX * window.innerWidth}px`;
        fakeCursorEl.style.top = `${state.cursorY * window.innerHeight}px`;
        if (state.cursorDown) {
          fakeCursorEl.classList.add('down');
        } else {
          fakeCursorEl.classList.remove('down');
        }
      } else {
        fakeCursorEl.style.display = 'none';
      }
    }

    // DETERMINISTIC SEEK FOR HEADLESS EVAL & REPLAY
    window.seek = function(t) {
      const clampedT = Math.max(0, Math.min(t, TOUR_DURATION));

      sloshSim.reset();
      const fixedDt = 1 / 60;
      let curT = 0;
      let lastEuler = new THREE.Euler();

      while (curT <= clampedT) {
        const s = getTourStateAt(curT);
        const curEuler = new THREE.Euler(s.rotX, s.rotY, s.rotZ, 'YXZ');
        const dRotX = (curEuler.x - lastEuler.x) / fixedDt;
        const dRotY = (curEuler.y - lastEuler.y) / fixedDt;
        lastEuler = curEuler;

        const rotMat = new THREE.Matrix4().makeRotationFromEuler(curEuler);
        sloshSim.step(fixedDt, rotMat, new THREE.Vector2(dRotX, dRotY));
        if (s.impulse > 0) {
          sloshSim.addImpulse(s.impulse);
        }
        curT += fixedDt;
      }

      const finalState = getTourStateAt(clampedT);
      applyState(finalState);
      updateLiquidMesh();

      const energy = THREE.MathUtils.clamp((sloshSim.tiltVelocity.length() + sloshSim.impulseWave) * 0.5, 0, 1);
      updateRings(energy);

      renderer.render(scene, camera);
    };

    if (isRenderMode) {
      window.seek(0);
      window.renderReady = true;
    } else {
      let tourClock = 0;

      function animate(now) {
        requestAnimationFrame(animate);

        const dt = Math.min((now - lastFrameTime) * 0.001, 0.1);
        lastFrameTime = now;

        if (!isUserInteracting && !tourPaused) {
          tourClock += dt;
          if (tourClock > TOUR_DURATION) {
            tourClock = 0;
          }

          const state = getTourStateAt(tourClock);
          applyState(state);

          const rotMat = new THREE.Matrix4().makeRotationFromQuaternion(iconRoot.quaternion);
          const ang = new THREE.Vector2(
            Math.sin(tourClock * 2.0) * 1.5,
            Math.cos(tourClock * 2.0) * 1.5
          );
          sloshSim.step(dt, rotMat, ang);
          if (state.impulse > 0) {
            sloshSim.addImpulse(state.impulse);
          }
        } else {
          fakeCursorEl.style.display = 'none';

          if (!isPointerDown) {
            const deltaQuat = new THREE.Quaternion();
            deltaQuat.setFromEuler(new THREE.Euler(angularVel.x * dt, angularVel.y * dt, 0, 'XYZ'));
            iconQuaternion.premultiply(deltaQuat);
            iconRoot.quaternion.copy(iconQuaternion);

            angularVel.multiplyScalar(Math.max(0, 1 - 3.2 * dt));
          } else {
            iconRoot.quaternion.copy(iconQuaternion);
          }

          const rotMat = new THREE.Matrix4().makeRotationFromQuaternion(iconRoot.quaternion);
          sloshSim.step(dt, rotMat, angularVel);
        }

        updateLiquidMesh();

        const motionEnergy = THREE.MathUtils.clamp(
          (sloshSim.tiltVelocity.length() * 0.2 + angularVel.length() * 0.08 + sloshSim.impulseWave * 2.0),
          0,
          1
        );
        updateRings(motionEnergy);

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
